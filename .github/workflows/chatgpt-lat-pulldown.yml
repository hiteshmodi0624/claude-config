name: ChatGPT Lat Pulldown Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'lat_pulldown/**'
      - '.github/workflows/chatgpt-lat-pulldown.yml'

jobs:
  build:
    if: github.head_ref == 'chatgpt/lat-pulldown-build-20260821'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install headless graphics runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxrender1 libxi6 libxkbcommon0
      - name: Download Blender 4.5.12 LTS
        run: |
          curl -L --fail --retry 3 -o blender.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz
          tar -xf blender.tar.xz
          mv blender-4.5.12-linux-x64 blender
      - name: Build animated Blender scene
        run: |
          mkdir -p output
          sed -i "s/scene.world.color=(0.018,0.022,0.03)/scene.world=bpy.data.worlds.new('World'); scene.world.color=(0.018,0.022,0.03)/" lat_pulldown/build_blend.py
          ./blender/blender --background --factory-startup --python lat_pulldown/build_blend.py -- output/lat_pulldown.blend
          test -s output/lat_pulldown.blend
          ls -lh output
      - name: Verify blend opens
        run: |
          ./blender/blender --background output/lat_pulldown.blend --python-expr "import bpy; assert len(bpy.data.objects)>20; assert bpy.context.scene.frame_end==96; print('VERIFY', len(bpy.data.objects), bpy.context.scene.frame_end)"
      - name: Upload blend and previews
        uses: actions/upload-artifact@v4
        with:
          name: lat-pulldown-blend
          path: output/
          compression-level: 6
